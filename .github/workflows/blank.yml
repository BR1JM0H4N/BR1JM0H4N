name: Generate Snake from Contributions

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-snake:
    name: Generate snake game from contribution graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake game from contribution grid
        uses: Platane/snk@v3.5.0
        with:
          filename: snake.html

      - name: Upload generated snake artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake
          path: snake.html
